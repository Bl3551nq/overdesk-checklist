<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="transparent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overdesk Checklist">
<title>Overdesk Checklist</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  overflow:clip;
  font-family:-apple-system,'Helvetica Neue',sans-serif;
  user-select:none;
  background: transparent;
}

/* ═══════════════════════════════════════════════════════
   CARD
═══════════════════════════════════════════════════════ */
.card {
  position:relative; z-index:10;
  width:320px;
  border-radius:36px;
  padding:14px 20px 14px;
  background:rgba(18,14,30,0.96);
  border:1px solid rgba(255,255,255,0.08);
  display:flex; flex-direction:column;
  transform-origin: center center;
  animation:cardIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  transform-origin: 50% 50%;
  flex-shrink: 0;
  will-change: transform;
  --accent:      rgba(110,0,210,0.9);
  --accent-soft: rgba(130,0,255,0.18);
  /* theme tokens — dark defaults */
  --bg:          rgba(28,28,34,0.88);
  --text:        #ffffff;
  --text-dim:    rgba(255,255,255,0.4);
  --text-mid:    rgba(255,255,255,0.75);
  --divider:     rgba(255,255,255,0.09);
  --icon-idle:   rgba(255,255,255,0.07);
  --opt-hover:   rgba(255,255,255,0.07);
  --opt-active:  rgba(255,255,255,0.09);
  --pill:        rgba(255,255,255,0.18);
  --input-bg:    rgba(255,255,255,0.08);
  --input-border:rgba(255,255,255,0.22);
  --del-bg:      rgba(255,50,50,0.18);
  --del-color:   rgba(255,110,110,0.9);
  --add-color:   rgba(255,255,255,0.28);
  --add-border:  rgba(255,255,255,0.1);
  --edit-bg:     rgba(255,255,255,0.07);
  --edit-hover:  rgba(255,255,255,0.14);
}
@keyframes cardIn{from{opacity:0;transform:scale(0.9) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}

/* ── Light mode overrides ───────────────────────────── */
.card.light {
  background:rgba(245,245,250,0.98);
  border:1px solid rgba(0,0,0,0.08);
  --text:        #111111;
  --text-dim:    rgba(0,0,0,0.35);
  --text-mid:    rgba(0,0,0,0.7);
  --divider:     rgba(0,0,0,0.08);
  --icon-idle:   rgba(0,0,0,0.09);
  --icon-border: rgba(0,0,0,0.14);
  --opt-hover:   rgba(0,0,0,0.05);
  --opt-active:  rgba(0,0,0,0.08);
  --pill:        rgba(0,0,0,0.15);
  --input-bg:    rgba(0,0,0,0.05);
  --input-border:rgba(0,0,0,0.18);
  --del-bg:      rgba(200,0,0,0.10);
  --del-color:   rgba(180,0,0,0.85);
  --add-color:   rgba(0,0,0,0.25);
  --add-border:  rgba(0,0,0,0.12);
  --edit-bg:     rgba(0,0,0,0.06);
  --edit-hover:  rgba(0,0,0,0.12);
}

/* ═══════════════════════════════════════════════════════
   TOP BAR  (theme toggle LEFT · minimize pill CENTER · edit RIGHT)
═══════════════════════════════════════════════════════ */
.top-bar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px; flex-shrink:0; position:relative;
}

/* ── Theme toggle switch ──── */
.theme-switch{
  width:42px; height:24px; border-radius:99px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.1);
  cursor:pointer; position:relative;
  transition:background 0.3s, border-color 0.3s;
  flex-shrink:0;
}
.card.light .theme-switch{
  background:rgba(0,0,0,0.10);
  border-color:rgba(0,0,0,0.10);
}
.theme-switch-knob{
  position:absolute; top:3px; left:3px;
  width:16px; height:16px; border-radius:50%;
  background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,0.35);
  transition:transform 0.28s cubic-bezier(0.34,1.56,0.64,1), background 0.3s;
  display:flex; align-items:center; justify-content:center;
}
.theme-switch-knob svg{width:9px;height:9px;fill:none;stroke:#888;stroke-width:1.8;stroke-linecap:round;}
.card.light .theme-switch-knob{
  transform:translateX(18px);
  background:#1a1a2e;
}
.card.light .theme-switch-knob svg{ stroke:#ccc; }
/* sun icon in dark, moon in light — toggled via JS */

/* ── Minimize pill center ─── */
.minimize-bar{
  position:absolute; left:50%; transform:translateX(-50%);
  padding:4px 10px; cursor:pointer;
}
.minimize-pill{
  width:36px; height:4px; border-radius:99px;
  background:var(--pill);
  transition:background 0.2s, width 0.2s;
}
.minimize-bar:hover .minimize-pill{ width:46px; background:rgba(150,100,255,0.55); }
.card.minimized .minimize-pill{ background:var(--accent); box-shadow:0 0 14px 4px var(--accent-soft), 0 0 28px 6px var(--accent-soft); width:52px; height:5px; opacity:1; filter:brightness(1.3); }

/* ── Edit button right ───── */
.edit-toggle{
  width:30px; height:30px; border-radius:50%;
  background:var(--edit-bg); border:1px solid transparent;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); transition:all 0.2s ease; flex-shrink:0;
}
.edit-toggle:hover,.edit-toggle:active{ background:var(--edit-hover); color:var(--text); }
.edit-toggle.on{ background:var(--accent); color:#fff; }
.edit-toggle svg{ width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }

/* ═══════════════════════════════════════════════════════
   ICON WRAP + PROGRESS RING
═══════════════════════════════════════════════════════ */
.icon-wrap{ position:relative; flex-shrink:0; }
.progress-ring{
  position:absolute; inset:-5px;
  width:calc(100% + 10px); height:calc(100% + 10px);
  transform:rotate(-90deg); pointer-events:none; overflow:visible;
}
.progress-ring-track{ fill:none; stroke:rgba(255,255,255,0.07); stroke-width:2.5; }
.progress-ring-fill{
  fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linecap:round;
  stroke-dasharray:188.5; stroke-dashoffset:188.5;
  transition:stroke-dashoffset 0.45s cubic-bezier(0.4,0,0.2,1), stroke 0.3s;
  filter:drop-shadow(0 0 3px var(--accent-soft));
}
.progress-count{
  position:absolute; bottom:-16px; left:50%; transform:translateX(-50%);
  font-size:9px; font-weight:600; color:var(--accent);
  letter-spacing:0.04em; white-space:nowrap; pointer-events:none;
  opacity:0; transition:opacity 0.2s;
}
.icon-btn.active ~ .progress-count{ opacity:1; }

/* ═══════════════════════════════════════════════════════
   COLOR SWATCH (edit mode)
═══════════════════════════════════════════════════════ */
.color-swatch-wrap{
  display:none; align-items:center; gap:7px;
  margin-bottom:10px; flex-shrink:0;
}
body.editing .color-swatch-wrap{ display:flex; }
.color-swatch{
  width:18px; height:18px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.25);
  cursor:pointer; flex-shrink:0;
  transition:transform 0.2s, box-shadow 0.2s;
  box-shadow:0 0 6px 1px var(--accent-soft);
  background:var(--accent);
}
.color-swatch:hover{ transform:scale(1.15); box-shadow:0 0 10px 2px var(--accent-soft); }
.color-swatch-label{ font-size:10px; color:var(--text-dim); letter-spacing:0.06em; text-transform:uppercase; }
#accent-color-input{ position:absolute; opacity:0; pointer-events:none; width:0; height:0; }

.icon-btn{
  width:50px; height:50px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--icon-idle); border:1px solid transparent;
  cursor:pointer; color:var(--text-dim);
  transition:background 0.25s cubic-bezier(0.34,1.56,0.64,1), color 0.2s, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  flex-shrink:0; position:relative; z-index:1;
}
.icon-btn svg{ width:22px; height:22px; fill:currentColor; }
.icon-btn:nth-child(1){--ibg:rgba(215,25,75,0.9);}
.icon-btn:nth-child(2){--ibg:rgba(140,0,225,0.9);}
.icon-btn:nth-child(3){--ibg:rgba(205,15,95,0.9);}
.icon-btn:nth-child(4){--ibg:rgba(110,0,210,0.9);}
.icon-btn:nth-child(5){--ibg:rgba(0,180,155,0.9);}
.icon-btn:active{ color:#fff; transform:scale(0.95); }
.icon-btn.active{ background:var(--ibg); color:#fff; transform:scale(1.06); }
.icon-btn.has-liquid{ background:transparent !important; color:#fff; }
.icon-btn.has-liquid svg{ filter: drop-shadow(0 0 2px rgba(0,0,0,0.25)); }
.card.light .icon-btn.has-liquid{ color:rgba(80,80,90,0.85); }

/* ═══════════════════════════════════════════════════════
   TITLE
═══════════════════════════════════════════════════════ */
.mode-label{ font-size:10px; font-weight:500; color:var(--text-dim); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:3px; flex-shrink:0; }
.title-wrap{ margin-bottom:12px; flex-shrink:0; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.title{ font-size:28px; font-weight:700; color:var(--text); letter-spacing:-0.02em; line-height:1.1; display:inline-block; min-width:40px; border-radius:8px; transition:opacity 0.18s,transform 0.18s,color 0.3s; cursor:default; }
.title.editable{ cursor:text; }
.title.editable:hover{ background:var(--opt-hover); padding:0 5px; margin:0 -5px; }
.title.switching{ opacity:0; transform:translateY(4px); }
.title-input{ font-size:28px; font-weight:700; color:var(--text); letter-spacing:-0.02em; background:var(--input-bg); border:1px solid var(--input-border); border-radius:9px; padding:1px 9px; outline:none; width:100%; caret-color:var(--text); display:none; }

/* ═══════════════════════════════════════════════════════
   OPTIONS
═══════════════════════════════════════════════════════ */
.divider{ height:0.5px; background:var(--divider); margin-bottom:0; flex-shrink:0; }

.scroll-area{
  overflow-y:auto; overflow-x:hidden;
  padding-top:2px; padding-bottom:4px; padding-right:6px;
  height:176px; flex-shrink:0;
  scrollbar-width:none;
}
.scroll-area::-webkit-scrollbar{ width:4px; }
.scroll-area::-webkit-scrollbar-track{ background:transparent; border-radius:99px; }
.scroll-area::-webkit-scrollbar-thumb{ background:transparent; border-radius:99px; }
.scroll-area:hover{ scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
.scroll-area:hover::-webkit-scrollbar-track{ background:var(--opt-hover); }
.scroll-area:hover::-webkit-scrollbar-thumb{ background:var(--accent); box-shadow:0 0 6px 1px var(--accent-soft); }
.scroll-area:hover::-webkit-scrollbar-thumb:hover{ background:var(--text); }

.options{ list-style:none; display:flex; flex-direction:column; transition:opacity 0.18s; }
.options.switching{ opacity:0; }

.option{
  display:flex; align-items:center; gap:10px;
  padding:10px 10px; border-radius:14px;
  font-size:15px; font-weight:400; color:var(--text-mid);
  cursor:pointer; transition:background 0.15s; letter-spacing:-0.01em;
}
.option:hover{ background:var(--opt-hover); }
.option:active{ background:var(--opt-active); }

/* Checkbox box */
.check-box{
  width:17px; height:17px; border-radius:4px; flex-shrink:0;
  border:1.8px solid rgba(255,255,255,0.25);
  display:flex; align-items:center; justify-content:center;
  transition:background 0.18s, border-color 0.18s;
  background:transparent;
}
.card.light .check-box{ border-color:rgba(0,0,0,0.2); }
.option.selected .check-box{
  background:var(--accent);
  border-color:var(--accent);
}
.check-box svg{
  width:10px; height:10px;
  stroke:#fff; fill:none; stroke-width:2.8;
  stroke-linecap:round; stroke-linejoin:round;
  opacity:0; transform:scale(0.6); transition:opacity 0.15s, transform 0.15s;
}
.option.selected .check-box svg{ opacity:1; transform:scale(1); }

/* Strikethrough text when checked */
.opt-text{ flex:1; min-width:0; transition:color 0.2s, opacity 0.2s; }
.option.selected .opt-text{
  text-decoration:line-through;
  text-decoration-color:var(--text-dim);
  color:var(--text-dim);
  opacity:0.6;
}
.opt-input{ flex:1; font-size:15px; font-weight:400; color:var(--text); background:var(--input-bg); border:1px solid var(--input-border); border-radius:7px; padding:2px 7px; outline:none; caret-color:var(--text); display:none; min-width:0; }

.del-btn{ width:20px;height:20px;border-radius:50%;background:var(--del-bg);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;color:var(--del-color);flex-shrink:0;font-size:14px;line-height:1;transition:background 0.15s; }
.add-btn{ display:none;align-items:center;gap:8px;padding:10px;border-radius:12px;font-size:14px;color:var(--add-color);cursor:pointer;border:1.5px dashed var(--add-border);background:transparent;width:100%;text-align:left;transition:all 0.15s;margin-top:5px; }
.add-btn svg{ width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0; }

body.editing .del-btn{ display:flex; }
body.editing .add-btn{ display:flex; }
body.editing .option{ cursor:default; }

/* Minimized — smooth height collapse */
.card-body{
  overflow: hidden;
  max-height: 600px;
  opacity: 1;
  transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
              opacity    0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.card.minimized .card-body{
  max-height: 0;
  opacity: 0;
  pointer-events: none;
}
.card{ transition: padding 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
.card.minimized{ padding-top:10px; padding-bottom:10px; }
.icons{ display:flex; justify-content:center; gap:8px; align-items:center; margin-bottom:16px; flex-shrink:0; width:100%;
  transition: margin 0.35s cubic-bezier(0.4,0,0.2,1); }
.card.minimized .icons{ margin-bottom:0; }
.mode-label, .title-wrap, .divider{
  transition: opacity 0.2s ease, max-height 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow: hidden;
  max-height: 100px;
  opacity: 1;
}
.card.minimized .mode-label,
.card.minimized .title-wrap,
.card.minimized .divider{
  opacity: 0;
  max-height: 0;
  pointer-events: none;
}

/* ═══════════════════════════════════════════════════════
   RESIZE HANDLE (left side)
═══════════════════════════════════════════════════════ */
.resize-handle{
  position:absolute;
  left:-10px; top:50%; transform:translateY(-50%);
  width:10px; height:50px; border-radius:6px 0 0 6px;
  background:var(--accent);
  opacity:0.35;
  cursor:ew-resize;
  transition:opacity 0.2s, width 0.2s;
  display:flex; align-items:center; justify-content:center;
}
.resize-handle::after{
  content:'';
  width:2px; height:22px; border-radius:99px;
  background:rgba(255,255,255,0.6);
  box-shadow:4px 0 0 rgba(255,255,255,0.6);
}
.resize-handle:hover{ opacity:0.85; width:12px; }

/* ═══════════════════════════════════════════════════════
   TOP-BAR RIGHT GROUP
═══════════════════════════════════════════════════════ */
.top-bar-right{ display:flex; align-items:center; gap:5px; flex-shrink:0; }

/* ── Close button ─────────────────────────────────── */
.close-btn{
  width:30px; height:30px; border-radius:50%;
  background:var(--edit-bg); border:1px solid transparent;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); transition:all 0.2s ease; flex-shrink:0;
}
.close-btn:hover,.close-btn:active{ background:rgba(255,50,50,0.2); color:rgba(255,110,110,0.9); }
.close-btn svg{ width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round; }

/* ═══════════════════════════════════════════════════════
   ICON EDIT INDICATOR (dot badge in edit mode)
═══════════════════════════════════════════════════════ */
body.editing .icon-btn{ position:relative; }
body.editing .icon-btn::after{
  content:'';
  position:absolute; top:-2px; right:-2px;
  width:10px; height:10px; border-radius:50%;
  background:var(--accent);
  border:1.5px solid rgba(14,14,20,0.9);
  pointer-events:none;
  animation:dotPop 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
}
.card.light .icon-btn::after{ border-color:rgba(245,245,250,0.95); }
.card.light .icon-btn:not(.active):not(.has-liquid){
  border:1px solid var(--icon-border);
  color:rgba(0,0,0,0.6);
}
@keyframes dotPop{ from{transform:scale(0);} to{transform:scale(1);} }

/* ═══════════════════════════════════════════════════════
   ICON PICKER OVERLAY
═══════════════════════════════════════════════════════ */
.icon-picker{
  position:absolute; inset:0; z-index:50;
  border-radius:36px;
  background:rgba(13,11,22,0.97);
  display:none; flex-direction:column;
  padding:13px 14px 12px;
}
.icon-picker.open{
  display:flex;
  animation:pickerIn 0.22s cubic-bezier(0.34,1.3,0.64,1) both;
}
@keyframes pickerIn{ from{opacity:0;transform:scale(0.95);} to{opacity:1;transform:scale(1);} }

.picker-header{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px; flex-shrink:0;
}
.picker-title{
  font-size:10px; font-weight:600; color:rgba(255,255,255,0.35);
  letter-spacing:0.12em; text-transform:uppercase;
}
.picker-close{
  width:24px; height:24px; border-radius:50%;
  background:rgba(255,255,255,0.08); border:none;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:rgba(255,255,255,0.35); transition:all 0.15s;
}
.picker-close:hover{ background:rgba(255,50,50,0.22); color:rgba(255,110,110,0.9); }
.picker-close svg{ width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round; }

.picker-done{
  display:flex; align-items:center; gap:4px;
  padding:4px 10px; border-radius:99px;
  background:var(--accent); border:none; cursor:pointer;
  color:#fff; font-size:10px; font-weight:600; letter-spacing:0.04em;
  transition:opacity 0.15s;
}
.picker-done:hover{ opacity:0.85; }
.picker-done svg{ width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round; }

.picker-grid{
  display:grid; grid-template-columns:repeat(5,1fr); gap:5px;
  overflow-y:auto; flex:1; scrollbar-width:none;
}
.picker-grid::-webkit-scrollbar{ display:none; }

.picker-item{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:9px 3px 7px; border-radius:10px;
  cursor:pointer; transition:background 0.15s;
  border:1px solid transparent;
}
.picker-item:hover{ background:rgba(255,255,255,0.07); }
.picker-item.current{
  background:var(--accent-soft);
  border-color:rgba(150,80,255,0.3);
}
.picker-item svg{ width:19px; height:19px; flex-shrink:0; color:rgba(255,255,255,0.85); }
.picker-item span{
  font-size:7.5px; color:rgba(255,255,255,0.3); text-align:center;
  letter-spacing:0.02em; line-height:1.2; white-space:nowrap; overflow:hidden; max-width:100%;
}

/* Light mode picker */
.card.light .icon-picker{ background:rgba(237,236,248,0.98); }
.card.light .picker-title{ color:rgba(0,0,0,0.35); }
.card.light .picker-close{ background:rgba(0,0,0,0.07); color:rgba(0,0,0,0.35); }
.card.light .picker-close:hover{ background:rgba(200,0,0,0.1); color:rgba(180,0,0,0.85); }
.card.light .picker-item:hover{ background:rgba(0,0,0,0.05); }
.card.light .picker-item svg{ color:rgba(0,0,0,0.65); }
.card.light .picker-item span{ color:rgba(0,0,0,0.35); }

/* ═══════════════════════════════════════════════════════
   UPDATE BANNER
═══════════════════════════════════════════════════════ */
.update-banner{
  position:absolute; bottom:14px; left:14px; right:14px;
  z-index:60;
  background:linear-gradient(135deg,rgba(100,40,220,0.95),rgba(180,30,80,0.95));
  border-radius:14px;
  padding:10px 14px;
  display:none; align-items:center; justify-content:space-between; gap:8px;
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
  animation:pickerIn 0.3s cubic-bezier(0.34,1.3,0.64,1) both;
}
.update-banner.show{ display:flex; }
.update-banner-text{ font-size:11px; color:#fff; font-weight:500; line-height:1.4; }
.update-banner-text span{ opacity:0.7; font-size:10px; display:block; }
.update-install-btn{
  background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.3);
  color:#fff; font-size:11px; font-weight:600; border-radius:8px;
  padding:5px 10px; cursor:pointer; white-space:nowrap; flex-shrink:0;
  transition:background 0.15s;
}
.update-install-btn:hover{ background:rgba(255,255,255,0.35); }
.update-install-btn.downloading{ opacity:0.6; pointer-events:none; }
.card.light .update-banner{ background:linear-gradient(135deg,rgba(80,20,200,0.95),rgba(160,10,60,0.95)); }

/* ═══════════════════════════════════════════════════════
   LICENSE SCREEN
═══════════════════════════════════════════════════════ */
.license-screen{
  position:fixed; inset:0; z-index:9999;
  background:rgba(10,6,20,0.97);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:28px 22px; gap:14px;
  border-radius:28px;
}
.license-logo{ width:52px; height:52px; margin-bottom:4px; }
.license-title{ font-size:17px; font-weight:700; color:#fff; letter-spacing:0.01em; }
.license-sub{ font-size:11px; color:rgba(255,255,255,0.4); text-align:center; line-height:1.5; }
.license-input{
  width:100%; padding:11px 14px;
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
  border-radius:12px; color:#fff; font-size:11px; font-family:monospace;
  letter-spacing:0.06em; text-align:center; outline:none;
  transition:border-color 0.2s;
}
.license-input:focus{ border-color:rgba(150,80,255,0.6); }
.license-input.error{ border-color:rgba(255,60,60,0.7); animation:shake 0.3s ease; }
@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  75%{transform:translateX(6px);}
}
.license-btn{
  width:100%; padding:12px; border-radius:12px;
  background:linear-gradient(135deg,rgba(110,0,210,0.9),rgba(180,30,80,0.9));
  color:#fff; font-size:14px; font-weight:600; border:none; cursor:pointer;
  transition:opacity 0.15s;
}
.license-btn:hover{ opacity:0.85; }
.license-hint{ font-size:10px; color:rgba(255,255,255,0.25); text-align:center; }

/* ═══════════════════════════════════════════════════════
/* ═══════════════════════════════════════════════════════
   RESET BUTTON
═══════════════════════════════════════════════════════ */
.reset-wrap{
  cursor:pointer; margin-top:4px; border-radius:10px;
  border:1px solid var(--divider);
  transition:all 0.15s;
}
.reset-wrap:hover{ background:rgba(255,60,60,0.1); border-color:rgba(255,60,60,0.3); }
.reset-wrap:hover .reset-btn{ color:rgba(255,100,100,0.9); }
.reset-btn{
  display:flex; align-items:center; gap:6px;
  width:100%; padding:9px 10px; border-radius:10px;
  background:transparent; border:none;
  color:var(--text-dim); font-size:11px; cursor:pointer;
  flex-shrink:0; pointer-events:none;
}
.reset-btn svg{ width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; pointer-events:none; }

/* ═══════════════════════════════════════════════════════
   LIQUID CONTAINER — sits behind icon button
═══════════════════════════════════════════════════════ */
.icon-wrap{
  position:relative; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.liquid-container{
  position:absolute; inset:0; border-radius:50%;
  overflow:hidden; z-index:0; pointer-events:none;
}
.liquid-container svg{ width:100%; height:100%; display:block; }
/* Hidden legacy ring placeholder */
.progress-ring{ display:none; }

/* Wave CSS animations — slosh, not scroll */
@keyframes liquidSlosh{
  0%   { transform: translateX(-10px); }
  50%  { transform: translateX(10px);  }
  100% { transform: translateX(-10px); }
}
@keyframes liquidBob{
  0%,100%{ transform: translateY(0);    }
  50%    { transform: translateY(-2px); }
}

/* progress counter next to mode title */
.mode-counter{
  font-size:13px; font-weight:600; color:var(--accent);
  opacity:0.8; letter-spacing:0.02em;
  transition:opacity 0.2s, color 0.3s;
  flex-shrink:0;
}

/* ═══════════════════════════════════════════════════════
   COLOR PICKER ROW (inside icon picker)
═══════════════════════════════════════════════════════ */
.color-row{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  padding:8px 0 10px; border-bottom:1px solid rgba(255,255,255,0.08); margin-bottom:8px;
}
.card.light .color-row{ border-bottom-color:rgba(0,0,0,0.08); }
.color-swatch{
  width:22px; height:22px; border-radius:50%; cursor:pointer; flex-shrink:0;
  border:2px solid transparent; transition:transform 0.15s, border-color 0.15s;
}
.color-swatch:hover{ transform:scale(1.15); }
.color-swatch.active{ border-color:#fff; transform:scale(1.1); }
.color-reset{
  display:flex; align-items:center; justify-content:center;
  border-style:solid; border-color:rgba(255,255,255,0.3);
}
.color-reset svg{ width:12px;height:12px;pointer-events:none; }
.color-custom-wrap{
  width:22px; height:22px; border-radius:50%; overflow:hidden; flex-shrink:0;
  border:2px dashed rgba(255,255,255,0.3); cursor:pointer; position:relative;
  display:flex; align-items:center; justify-content:center; transition:border-color 0.15s;
}
.color-custom-wrap:hover{ border-color:rgba(255,255,255,0.7); }
.color-custom-wrap svg{ width:10px;height:10px;stroke:rgba(255,255,255,0.5);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none; }
.color-custom-input{ position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%; }
/* ── Drag cursor only applied via JS during actual mousedown ── */
.drag-corner{
  position:absolute; top:0; left:0; right:0;
  height:54px;         /* covers the top bar — buttons sit on top via z-index */
  border-radius:28px 28px 0 0;
  z-index:1;           /* below buttons (z-index:10+) but above card bg */
  pointer-events:auto; /* IPC drag target in Electron */
  cursor:grab;
}
.drag-corner:active{ cursor:grabbing; }
/* Interactive elements keep pointer cursor */
button, input, .option, .icon-btn, .edit-toggle, .close-btn,
.add-btn, .theme-switch, .minimize-pill, .minimize-bar,
.resize-handle, .reset-wrap,
.color-swatch, .color-custom-wrap, a, select {
  cursor: pointer;
}
.scroll-area { cursor: default; }
</style>

  </svg>

  <div class="license-sub">Enter your license key to activate.<br>Find it in your Gumroad receipt.</div>
  <input class="license-input" id="license-input" type="text" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX" maxlength="35" oninput="formatLicenseKey(this)" onkeydown="if(event.key==='Enter') activateLicense()"/>

<script>
/* ─── State ─────────────────────────────────────────── */
let currentMode='sync', editMode=false, isLight=false, _switching=false;

/* ═══════════════════════════════════════════════════════
   LICENSE
═══════════════════════════════════════════════════════ */
async function checkLicense(){
  if (!window.electronAPI) return; // browser preview — skip
  const res = await window.electronAPI.checkLicense();
  if (!res.ok) {
    document.getElementById('license-screen').style.display = 'flex';
  }
}

function formatLicenseKey(inp){
  const v=inp.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,32);
  const g=[v.slice(0,8),v.slice(8,16),v.slice(16,24),v.slice(24,32)].filter(s=>s.length>0);
  inp.value=g.join('-');
}

async function activateLicense(){
  const inp = document.getElementById('license-input');
  const key = inp.value.trim();
  if(key.length < 35){
    inp.classList.add('error');
    setTimeout(() => inp.classList.remove('error'), 600);
    return;
  }
  try{
    const body = new URLSearchParams({
      product_permalink: 'app3',
      license_key: key,
      increment_uses_count: 'false'
    });
    const r = await fetch('https://api.gumroad.com/v2/licenses/verify',{ method:'POST', body });
    const data = await r.json();
    if(!data.success){
      inp.classList.add('error');
      setTimeout(() => inp.classList.remove('error'), 600);
      return;
    }
    if(window.electronAPI) await window.electronAPI.validateLicense(key);
    else localStorage.setItem('overdesk_license', key);
    document.getElementById('license-screen').style.display = 'none';
  } catch(e){
    inp.classList.add('error');
    setTimeout(() => inp.classList.remove('error'), 600);
  }
}


/* ═══════════════════════════════════════════════════════
   RESET CHECKLIST
═══════════════════════════════════════════════════════ */
function resetChecklist(){
  if(editMode){
    Object.keys(MODES).forEach(m => localStorage.setItem('fm_sel_'+m, JSON.stringify([])));
    document.querySelectorAll('#options-list .option').forEach(o => o.classList.remove('selected'));
  } else {
    document.querySelectorAll('#options-list .option').forEach(o => o.classList.remove('selected'));
  }
  playSound('reset');
  updateAllRings();
  autoSave();
}

/* ═══════════════════════════════════════════════════════
   SOUND ALERTS
═══════════════════════════════════════════════════════ */
function playSound(type){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);

    if (type === 'complete'){
      // Two-tone "done" chime
      osc.frequency.setValueAtTime(660, ctx.currentTime);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start(); osc.stop(ctx.currentTime + 0.5);
    } else if (type === 'check'){
      osc.frequency.setValueAtTime(520, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      osc.start(); osc.stop(ctx.currentTime + 0.18);
    } else if (type === 'reset'){
      osc.frequency.setValueAtTime(330, ctx.currentTime);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.start(); osc.stop(ctx.currentTime + 0.25);
    }
  } catch(e){}
}

/* ─── Icon Library (Glossary) ───────────────────────── */
const ICON_LIBRARY = {
  target:       { label:'Target',    svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>` },
  candle:       { label:'Candles',   svg:`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4.2" y="4" width="1.3" height="4" rx="0.6"/><rect x="3" y="8" width="3.8" height="6" rx="0.8"/><rect x="4.2" y="14" width="1.3" height="3" rx="0.6"/><rect x="10.4" y="2" width="1.3" height="5" rx="0.6"/><rect x="9.2" y="7" width="3.8" height="8" rx="0.8"/><rect x="10.4" y="15" width="1.3" height="4" rx="0.6"/><rect x="16.6" y="6" width="1.3" height="4" rx="0.6"/><rect x="15.4" y="10" width="3.8" height="5" rx="0.8"/><rect x="16.6" y="15" width="1.3" height="4" rx="0.6"/></svg>` },
  dollar:       { label:'Dollar',    svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 1 0 0 7h5a3.5 3.5 0 1 1 0 7H6"/></svg>` },
  shield:       { label:'DND',       svg:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 6v6c0 5.25 3.5 9.74 8 11 4.5-1.26 8-5.75 8-11V6L12 2z" opacity="0.9"/><rect x="9.2" y="9" width="2" height="6" rx="0.6" fill="#fff" opacity="0.85"/><rect x="12.8" y="9" width="2" height="6" rx="0.6" fill="#fff" opacity="0.85"/></svg>` },
  bell:         { label:'Alerts',    svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>` },
  trending_up:  { label:'Bull',      svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>` },

function hexToAccent(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return {
    accent:`rgba(${r},${g},${b},0.9)`,
    soft:`rgba(${r},${g},${b},0.18)`
  };
}

function handleIconClick(mode, btn){
  if(editMode) openPicker(mode, btn);
  else switchMode(mode, btn);
}

function openPicker(mode){
  pickerTarget = mode;
  const colorRow = document.getElementById('color-row');
  colorRow.innerHTML = '';
  const currentAccent = MODES[mode].accent;

  // Reset-to-default swatch
  const resetSwatch = document.createElement('div');
  resetSwatch.className = 'color-swatch color-reset';
  resetSwatch.title = 'Reset to default';
  resetSwatch.style.background = MODES[mode].defaultAccent;
  resetSwatch.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>`;
  resetSwatch.addEventListener('click', () => {
    assignColor(mode, MODES[mode].defaultAccent, MODES[mode].defaultSoft, colorRow, resetSwatch);
  });
  colorRow.appendChild(resetSwatch);

  // Divider
  const div = document.createElement('div');
  div.style.cssText = 'width:1px;height:20px;background:rgba(255,255,255,0.12);flex-shrink:0;margin:0 2px;';
  colorRow.appendChild(div);

  COLOR_PRESETS.forEach(p => {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch' + (p.accent === currentAccent ? ' active' : '');
    swatch.style.background = p.accent;
    swatch.addEventListener('click', () => assignColor(mode, p.accent, p.soft, colorRow, swatch));
    colorRow.appendChild(swatch);
  });

  // Custom color picker
  const customWrap = document.createElement('div');
  customWrap.className = 'color-custom-wrap';
  customWrap.title = 'Custom colour';
  customWrap.innerHTML = `<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><input class="color-custom-input" type="color" value="#6e00d2"/>`;
  customWrap.querySelector('input').addEventListener('input', e => {
    const {accent,soft} = hexToAccent(e.target.value);
    customWrap.style.background = accent;
    colorRow.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
    assignColor(mode, accent, soft, colorRow, null);
  });
  colorRow.appendChild(customWrap);

  // Build icon grid
  const grid = document.getElementById('picker-grid');
  const current = iconAssignments[mode];
  grid.innerHTML = '';
  Object.entries(ICON_LIBRARY).forEach(([key, def]) => {
    const item = document.createElement('div');
    item.className = 'picker-item' + (key === current ? ' current' : '');
    item.innerHTML = def.svg + `<span>${def.label}</span>`;
    item.addEventListener('click', () => assignIcon(mode, key));
    grid.appendChild(item);
  });
  document.getElementById('icon-picker').classList.add('open');
}

function assignColor(mode, accent, soft, colorRow, activeSwatch){
  MODES[mode].accent = accent;
  MODES[mode].soft   = soft;
  if(mode === currentMode) applyAccent(mode);
  if(colorRow && activeSwatch){
    colorRow.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
    activeSwatch.classList.add('active');
  }
  updateAllRings();
  autoSave();
}

function closePicker(){
  document.getElementById('icon-picker').classList.remove('open');
  pickerTarget = null;
}

function assignIcon(mode, iconKey){
  iconAssignments[mode] = iconKey;
  const btn = document.querySelector(`.icon-btn[data-mode="${mode}"]`);
  if(btn){
    btn.innerHTML = ICON_LIBRARY[iconKey].svg;
  }
  if(window._afterRender) window._afterRender();
  updateAllRings();
  closePicker();
  autoSave();
}

function initIcons(){
  Object.entries(iconAssignments).forEach(([mode, iconKey]) => {
    const btn = document.querySelector(`.icon-btn[data-mode="${mode}"]`);
    if(btn && ICON_LIBRARY[iconKey]) btn.innerHTML = ICON_LIBRARY[iconKey].svg;
  });
}

/* ─── Close card ────────────────────────────────────── */
function closeCard(){
  if (window.electronAPI) {
    window.electronAPI.closeApp();
    return;
  }
  const card = document.getElementById('card');
  card.style.transition = 'opacity 0.28s ease, transform 0.28s ease';
  card.style.opacity    = '0';
  card.style.transform  = 'scale(0.88)';
  setTimeout(() => card.style.display = 'none', 290);
}

/* ═══════════════════════════════════════════════════════
   LIQUID FILL — animated inline SVG
═══════════════════════════════════════════════════════ */
function buildLiquidSVG(pct, accentRaw){
  const m = accentRaw.match(/[\d.]+/g) || ['150','80','255'];
  const r=+m[0], g=+m[1], b=+m[2];
  const base = `rgba(${r},${g},${b},0.5)`;
  const hi   = `rgba(${Math.min(r+80,255)},${Math.min(g+60,255)},${Math.min(b+80,255)},0.75)`;
  const size = 50, waterY = size * (1 - pct);
  const amp  = pct > 0.02 && pct < 0.98 ? 3.5 : 0;

  // Wider than the circle so slosh (±10px) never exposes a gap
  const waveW = size + 30; // 80px, 15px overhang each side
  const startX = -15;
  const steps = 60;
  const pts = [];
  for(let i=0;i<=steps;i++){
    const x = startX + (waveW/steps)*i;
    const y = waterY + amp*Math.sin((i/steps)*Math.PI*4);
    pts.push(`${i===0?'M':'L'}${x.toFixed(2)},${y.toFixed(2)}`);
  }
  const wavePath = pts.join(' ')+` L${startX+waveW},${size} L${startX},${size} Z`;

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}">
  <defs>
    <clipPath id="lc-${r}"><circle cx="25" cy="25" r="24.5"/></clipPath>
    <linearGradient id="lg-${r}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${hi}"/>
      <stop offset="100%" stop-color="${base}"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#lc-${r})">
    <rect x="${startX}" y="${waterY.toFixed(2)}" width="${waveW}" height="${(size-waterY+2).toFixed(2)}" fill="${base}"/>
    <g style="animation:liquidBob 3.2s ease-in-out infinite">
      <path style="animation:liquidSlosh 3.8s ease-in-out infinite;transform-origin:center center"
        d="${wavePath}" fill="url(#lg-${r})"/>
    </g>
  </g>
</svg>`;
}

function updateAllRings(){
  Object.keys(MODES).forEach(mode => {
    const container = document.getElementById('liquid-'+mode);
    const btn = document.querySelector(`.icon-btn[data-mode="${mode}"]`);
    if(!container || !btn) return;

    const total = MODES[mode].options.length;
    let done = 0;
    if(mode === currentMode){
      done = document.querySelectorAll('#options-list .option.selected').length;
    } else {
      try{ const s=localStorage.getItem('fm_sel_'+mode); done=s?JSON.parse(s).length:0; }catch(e){}
    }
    const pct = total>0 ? done/total : 0;

    if(mode === currentMode && pct > 0){
      container.innerHTML = buildLiquidSVG(pct, MODES[mode].accent);
      btn.classList.add('has-liquid');
    } else {
      container.innerHTML = '';
      btn.classList.remove('has-liquid');
    }
  });

  const counter = document.getElementById('mode-counter');
  if(counter){
    const total = MODES[currentMode].options.length;
    const done  = document.querySelectorAll('#options-list .option.selected').length;
    counter.textContent = `${done}/${total}`;
  }
}

}

/* ─── Theme toggle ───────────────────────────────────── */
const SUN_SVG = `<svg id="theme-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const MOON_SVG= `<svg id="theme-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function toggleTheme(){
  isLight = !isLight;
  const card = document.getElementById('card');
  const knob = document.getElementById('theme-knob');
  card.classList.toggle('light', isLight);
  knob.innerHTML = isLight ? MOON_SVG : SUN_SVG;
  const r = window._cardRatio || 1;
  knob.style.transform = isLight ? `translateX(${18*r}px)` : 'translateX(0)';
  autoSave();
}

/* ─── Minimize ───────────────────────────────────────── */
function toggleMinimize(){
  const card = document.getElementById('card');
  const body = card.querySelector('.card-body');

  // Capture the card's current visual center before toggling
  const rectBefore = card.getBoundingClientRect();
  const centerYBefore = rectBefore.top + rectBefore.height / 2;

  card.classList.toggle('minimized');
  if(card.classList.contains('minimized') && editMode) toggleEdit();

  // After the class toggles, adjust ty so the visual top stays anchored
  requestAnimationFrame(() => {
    const rectAfter = card.getBoundingClientRect();
    const centerYAfter = rectAfter.top + rectAfter.height / 2;
    // No correction needed — scaleY collapses in-place from top
    if(window.electronAPI) setTimeout(() => window.electronAPI.setHeight(card.offsetHeight), 320);
  });
}

/* ─── Edit ───────────────────────────────────────────── */
function toggleEdit(){
  const card = document.getElementById('card');
  // Auto-expand if minimized before entering edit mode
  if(!editMode && card.classList.contains('minimized')){
    card.classList.remove('minimized');
  }
  editMode=!editMode;
  document.body.classList.toggle('editing',editMode);
  const btn=document.getElementById('edit-toggle');
  btn.classList.toggle('on',editMode);
  btn.innerHTML=editMode
    ?`<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
    :`<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
  document.getElementById('mode-title').classList.toggle('editable',editMode);
  document.getElementById('reset-label').textContent = editMode ? 'Reset all' : 'Reset mode';
  renderOptions(currentMode); commitTitle();
}

/* ─── Title editing ──────────────────────────────────── */
document.getElementById('mode-title').addEventListener('click',()=>{
  if(!editMode)return;
  const h1=document.getElementById('mode-title'),inp=document.getElementById('title-input');
  inp.value=MODES[currentMode].title; h1.style.display='none'; inp.style.display='block'; inp.focus(); inp.select();
});
function commitTitle(){
  const h1=document.getElementById('mode-title'),inp=document.getElementById('title-input');
  if(!inp.style.display||inp.style.display==='none')return;
  const val=inp.value.trim()||MODES[currentMode].title;
  MODES[currentMode].title=val; h1.textContent=val; h1.style.display=''; inp.style.display='none';
}

/* ─── Options ────────────────────────────────────────── */
function checkHTML(){return`<span class="check-box"><svg viewBox="0 0 16 16"><polyline points="2,8 6,12 14,4"/></svg></span>`;}

function renderOptions(mode, forceIdxs){
  const list=document.getElementById('options-list');
  // Collect currently checked indices before wiping
  let checkedIdxs;
  if(forceIdxs !== undefined){
    checkedIdxs = Array.isArray(forceIdxs) ? forceIdxs : [forceIdxs];
  } else {
    checkedIdxs = [...list.querySelectorAll('.option.selected')].map(o=>[...list.children].indexOf(o));
  }
  list.innerHTML='';
  MODES[mode].options.forEach((text,i)=>{
    const li=document.createElement('li');
    li.className='option'+(checkedIdxs.includes(i)?' selected':'');
    const del=document.createElement('button');
    del.className='del-btn'; del.textContent='×';
    del.addEventListener('click',e=>{e.stopPropagation();if(MODES[currentMode].options.length>1){MODES[currentMode].options.splice(i,1);renderOptions(currentMode);}});
    const span=document.createElement('span'); span.className='opt-text'; span.textContent=text;
    const inp=document.createElement('input'); inp.className='opt-input'; inp.type='text'; inp.value=text;
    inp.addEventListener('blur',()=>{const v=inp.value.trim()||MODES[currentMode].options[i];MODES[currentMode].options[i]=v;span.textContent=v;span.style.display='';inp.style.display='none';});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();});
    li.appendChild(document.createRange().createContextualFragment(checkHTML()));
    li.appendChild(span); li.appendChild(inp); li.appendChild(del);
    li.addEventListener('click',e=>{
      if(e.target===del)return;
      if(editMode){span.style.display='none';inp.style.display='block';inp.focus();inp.select();}
      else{
        li.classList.toggle('selected');
        playSound('check');
        updateAllRings();
        const total = document.querySelectorAll('#options-list .option').length;
        const done  = document.querySelectorAll('#options-list .option.selected').length;
        if(done >= total) setTimeout(()=>playSound('complete'), 120);
      }
    });
    list.appendChild(li);
  });
  // re-apply current scale to newly created elements
  if(window._afterRender) window._afterRender();
  updateAllRings();
}

function addOption(){
  MODES[currentMode].options.push('New option'); renderOptions(currentMode);
  const items=document.querySelectorAll('#options-list .option');
  const last=items[items.length-1];
  if(last){const s=last.querySelector('.opt-text'),i=last.querySelector('.opt-input');s.style.display='none';i.style.display='block';i.focus();i.select();last.scrollIntoView({behavior:'smooth',block:'nearest'});}
}

/* ─── Mode switch ────────────────────────────────────── */
function switchMode(mode,btn){
  // save all checked indices for current mode before switching
  const allOpts=[...document.querySelectorAll('#options-list .option')];
  const idxs=allOpts.map((o,i)=>o.classList.contains('selected')?i:-1).filter(i=>i>=0);
  localStorage.setItem('fm_sel_'+currentMode, JSON.stringify(idxs));
  if(editMode)toggleEdit(); commitTitle(); currentMode=mode;
  // Clear liquid from all buttons before re-rendering
  document.querySelectorAll('.icon-btn').forEach(b=>{ b.classList.remove('has-liquid'); b.style.backgroundImage=''; b.style.backgroundColor=''; });
  document.querySelectorAll('.liquid-container').forEach(c=>{ c.innerHTML=''; });
  document.querySelectorAll('.icon-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  applyAccent(mode);
  const t=document.getElementById('mode-title'),l=document.getElementById('options-list');
  t.classList.add('switching'); l.classList.add('switching');
  _switching=true;
  setTimeout(()=>{
    t.textContent=MODES[mode].title;
    let restoredIdxs=[];
    try{const s=localStorage.getItem('fm_sel_'+mode);if(s)restoredIdxs=JSON.parse(s);}catch(e){}
    if(!Array.isArray(restoredIdxs))restoredIdxs=[];
    renderOptions(mode,restoredIdxs);
    t.classList.remove('switching');l.classList.remove('switching');
    _switching=false;
  },180);
}

/* ─── Card bounds — main polls cursor against these for click-through ── */
(function(){
  if(!window.electronAPI)return;
  const card=document.getElementById('card');
  if(!card)return;
  function send(){
    const r=card.getBoundingClientRect();
    window.electronAPI.cardBounds({x:r.left,y:r.top,w:r.width,h:r.height});
  }
  send();
  new ResizeObserver(send).observe(card);
  new MutationObserver(send).observe(card,{attributes:true,attributeFilter:['class','style']});
})();

/* ─── Scale + Drag — unified transform: translate(tx,ty) scale(s) ─── */
(function(){
  const card   = document.getElementById('card');
  const handle = document.getElementById('resize-handle');
  if(!card || !handle) return;

  const MIN_S = 0.6, MAX_S = 1.8;
  let tx = 0, ty = 0, scale = 1;
  let animCleared = false;

  window._cardScale   = 1;
  window._afterRender = function(){};

  function applyTransform(){
    card.style.transformOrigin = 'center center';
    card.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function clearAnim(){
    if(animCleared) return;
    animCleared = true;
    card.style.animation = 'none';
  }

  function setScale(s){
    scale = Math.min(MAX_S, Math.max(MIN_S, +s.toFixed(4)));
    window._cardScale = scale;
    localStorage.setItem('fm_scale', scale);
    applyTransform();
    return scale;
  }

  window._applyScale = (s) => {
    const clamped = setScale(s);
    if(window.electronAPI) window.electronAPI.scaleEnd(clamped);
  };

  // Restore saved scale after entry animation
  card.addEventListener('animationend', () => {
    clearAnim();
    try{
      const saved = parseFloat(localStorage.getItem('fm_scale'));
      if(saved >= MIN_S && saved <= MAX_S) setScale(saved);
    }catch(e){}
  }, {once:true});

  /* ── Scale handle drag ── */
  let scaleDragging = false, scaleStartX = 0, scaleStartS = 1;

  handle.addEventListener('mousedown', e => {
    clearAnim();
    scaleDragging = true;
    scaleStartX = e.screenX;
    scaleStartS = scale;
    document.body.style.userSelect = 'none';
    if(window.electronAPI) window.electronAPI.scaleStart();
    e.preventDefault();
    e.stopPropagation();
  });
  handle.addEventListener('touchstart', e => {
    clearAnim();
    scaleDragging = true;
    scaleStartX = e.touches[0].screenX;
    scaleStartS = scale;
    document.body.style.userSelect = 'none';
    if(window.electronAPI) window.electronAPI.scaleStart();
    e.preventDefault();
    e.stopPropagation();
  }, {passive:false});

  document.addEventListener('mousemove', e => {
    if(!scaleDragging) return;
    setScale(scaleStartS + (scaleStartX - e.screenX) / 300);
  });
  document.addEventListener('touchmove', e => {
    if(!scaleDragging) return;
    setScale(scaleStartS + (scaleStartX - e.touches[0].screenX) / 300);
    e.preventDefault();
  }, {passive:false});
  document.addEventListener('mouseup', () => {
    if(!scaleDragging) return;
    scaleDragging = false;
    document.body.style.userSelect = '';
    if(window.electronAPI) window.electronAPI.scaleEnd(scale);
  });
  document.addEventListener('touchend', () => {
    if(!scaleDragging) return;
    scaleDragging = false;
    document.body.style.userSelect = '';
    if(window.electronAPI) window.electronAPI.scaleEnd(scale);
  });

  /* ── Card drag (browser only) ── */
  if(window.electronAPI) return; // Electron handles window drag natively

  let cardDragging = false, dragOffX = 0, dragOffY = 0;

  function getXY(e){ return e.touches ? {x:e.touches[0].clientX,y:e.touches[0].clientY} : {x:e.clientX,y:e.clientY}; }

  card.addEventListener('mousedown', e => {
    if(scaleDragging) return;
    if(e.target.closest('button,input,.option,.icon-btn,.icons,.theme-switch,.minimize-bar,.resize-handle,.scroll-area,.add-btn,.reset-btn,.reset-wrap,.icon-picker,select,a,.top-bar-right,.minimize-pill')) return;
    cardDragging = true;
    const {x,y} = getXY(e);
    // Store offset relative to card visual center
    const rect = card.getBoundingClientRect();
    dragOffX = x - (rect.left + rect.width  / 2);
    dragOffY = y - (rect.top  + rect.height / 2);
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'grabbing';
    e.preventDefault();
  });
  card.addEventListener('touchstart', e => {
    if(scaleDragging) return;
    if(e.target.closest('button,input,.option,.icon-btn,.icons,.theme-switch,.minimize-bar,.resize-handle,.scroll-area,.add-btn,.reset-btn,.reset-wrap,.icon-picker,select,a,.top-bar-right,.minimize-pill')) return;
    cardDragging = true;
    const {x,y} = getXY(e);
    const rect = card.getBoundingClientRect();
    dragOffX = x - (rect.left + rect.width  / 2);
    dragOffY = y - (rect.top  + rect.height / 2);
    document.body.style.userSelect = 'none';
    e.preventDefault();
  }, {passive:false});

  document.addEventListener('mousemove', e => {
    if(!cardDragging) return;
    const {x,y} = getXY(e);
    // Natural center of card without any transform (body flex centers it)
    const vw = window.innerWidth, vh = window.innerHeight;
    const W  = card.offsetWidth,  H  = card.offsetHeight;
    const naturalCX = vw / 2, naturalCY = vh / 2;
    // Where we want the center to be
    const targetCX = x - dragOffX;
    const targetCY = y - dragOffY;
    tx = targetCX - naturalCX;
    ty = targetCY - naturalCY;
    applyTransform();
  });
  document.addEventListener('touchmove', e => {
    if(!cardDragging) return;
    const {x,y} = getXY(e);
    const vw = window.innerWidth, vh = window.innerHeight;
    const targetCX = x - dragOffX;
    const targetCY = y - dragOffY;
    tx = targetCX - vw / 2;
    ty = targetCY - vh / 2;
    applyTransform();
    e.preventDefault();
  }, {passive:false});

  const stopDrag = () => {
    if(!cardDragging) return;
    cardDragging = false;
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
  };
  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchend', stopDrag);
})();

/* ─── Auto-updater UI ───────────────────────────────── */
function installUpdate(){
  const btn = document.getElementById('update-install-btn');
  btn.textContent = 'Installing…';
  btn.classList.add('downloading');
  if (window.electronAPI) window.electronAPI.installUpdate();
}

if (window.electronAPI) {
  window.electronAPI.onUpdateAvailable((version) => {
    const banner = document.getElementById('update-banner');
    const vEl    = document.getElementById('update-version');
    if (vEl) vEl.textContent = `v${version} — downloading…`;
    if (banner) banner.classList.add('show');
  });
  window.electronAPI.onUpdateDownloaded(() => {
    const btn = document.getElementById('update-install-btn');
    const vEl = document.getElementById('update-version');
    if (btn) btn.textContent = 'Restart & Install';
    if (vEl) vEl.textContent = 'Ready to install';
  });
}
/* ─── Persistence ────────────────────────────────────── */
function saveState(){
  localStorage.setItem('fm_modes',       JSON.stringify(MODES));
  localStorage.setItem('fm_mode',        currentMode);
  localStorage.setItem('fm_theme',       isLight ? '1' : '0');
  localStorage.setItem('fm_width',       document.getElementById('card').offsetWidth);
  localStorage.setItem('fm_icons',       JSON.stringify(iconAssignments));
  const allOpts = [...document.querySelectorAll('#options-list .option')];
  const checkedIdxs = allOpts.map((o,i)=>o.classList.contains('selected')?i:-1).filter(i=>i>=0);
  if(!_switching) localStorage.setItem('fm_sel_'+currentMode, JSON.stringify(checkedIdxs));
}

function loadState(){
  // Clear stale data from old incompatible builds
  const stateVer = localStorage.getItem('fm_state_ver');
  if(stateVer !== '3'){
    ['fm_modes','fm_mode','fm_theme','fm_scale','fm_icons','fm_width'].forEach(k=>localStorage.removeItem(k));
    Object.keys(MODES).forEach(m=>localStorage.removeItem('fm_sel_'+m));
    localStorage.setItem('fm_state_ver','3');
    return; // use fresh defaults
  }
  try{
    const saved = localStorage.getItem('fm_modes');
    if(saved){
      const parsed = JSON.parse(saved);
      Object.keys(parsed).forEach(k=>{
        if(!MODES[k]) return;
        // Only restore title if valid string
        if(typeof parsed[k].title === 'string' && parsed[k].title.length > 0){
          MODES[k].title = parsed[k].title;
        }
        // Only restore options if valid non-empty array of strings
        if(Array.isArray(parsed[k].options) && parsed[k].options.length > 0
           && parsed[k].options.every(o => typeof o === 'string')){
          MODES[k].options = parsed[k].options;
        }
      });
    }
  } catch(e){}
  const mode = localStorage.getItem('fm_mode');
  if(mode && MODES[mode]) currentMode = mode;
  isLight = localStorage.getItem('fm_theme') === '1';
  try{
    const savedIcons = localStorage.getItem('fm_icons');
    if(savedIcons) iconAssignments = {...iconAssignments, ...JSON.parse(savedIcons)};
  }catch(e){}
}

function autoSave(){ requestAnimationFrame(saveState); }

/* ─── Init ───────────────────────────────────────────── */
try{ const s=localStorage.getItem('fm_modes'); if(s&&JSON.parse(s)?.alerts?.accent?.includes('220,90')) localStorage.removeItem('fm_modes'); }catch(e){}
loadState();

// Restore theme
if(isLight){
  document.getElementById('card').classList.add('light');
  document.getElementById('theme-knob').innerHTML = `<svg id="theme-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
  document.getElementById('theme-knob').style.transform = 'translateX(18px)';
}

// Restore icons
initIcons();

// Restore active icon button
document.querySelectorAll('.icon-btn').forEach(b=>{
  b.classList.toggle('active', b.dataset.mode === currentMode);
});

// Restore title
document.getElementById('mode-title').textContent = MODES[currentMode].title;

// Restore checked option indices (multi-select)
let savedIdxs = [];
try { const s = localStorage.getItem('fm_sel_'+currentMode); if(s) savedIdxs = JSON.parse(s); } catch(e){}
if(!Array.isArray(savedIdxs)) savedIdxs = [];
renderOptions(currentMode, savedIdxs);
applyAccent(currentMode);
updateAllRings();

// Hook auto-save into user actions
document.addEventListener('click',    autoSave);
document.addEventListener('touchend', autoSave);

// Check license on startup (Electron only)
checkLicense();

if('serviceWorker' in navigator){
  const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))));`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
